<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MauiApp1</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MauiApp1.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="d-flex align-items-center justify-content-center gap-2" style="height:100vh">
            <span class="spinner-border text-primary" aria-hidden="true"></span> Loading...
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Chart.js 4.5.1, hammer.js 2.0.8 (pan gestures) and chartjs-plugin-zoom 2.2.0, bundled with the app -->
    <script src="lib/chartjs/chart.umd.min.js"></script>
    <script src="lib/chartjs/hammer.min.js"></script>
    <script src="lib/chartjs/chartjs-plugin-zoom.min.js"></script>
    <script>
        // Match chart text to the app's compact font size.
        if (window.Chart) Chart.defaults.font.size = 11;
    </script>
    <script src="js/rvalues-chart.js"></script>
    <script src="js/jetmixing-chart.js"></script>
    <script src="js/aimodel-chart.js"></script>
    <script src="js/scatter-chart.js"></script>
    <script src="js/spc-chart.js"></script>
    <script src="js/analysis2-chart.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
